name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Typecheck (server, tests, UI)
        run: npm run typecheck
      - name: Build UI
        run: npm run build
      - name: SQLite integration spike
        run: npm run spike:sqlite
      - name: Tests
        run: npm test
      - name: Record exact SHA
        shell: bash
        run: echo "verified ${GITHUB_SHA} on ${{ matrix.os }} with $(node --version)"
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (real server, real SQLite)
        run: npm run test:e2e
