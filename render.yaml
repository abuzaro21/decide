# Render Blueprint for DECIDE — NOT APPLIED. Requires owner approval before any service is created.
# Free plan only: an omitted plan defaults to a paid plan, so every resource states `plan: free`.
services:
  - type: web
    name: decide-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3000"
# Keyless by design: the demo uses genuine recorded proposer outputs. Live mode (ANTHROPIC_API_KEY) stays supported in
# code but is deliberately not declared here, so Blueprint creation asks for no secrets.
# No disk, no database, no key-value store: demo state lives for one run and resets on restart/spin-down (K-10).
